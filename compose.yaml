services:
  rofl-mining:
    build: .
    image: ghcr.io/jnc0-000/office-aim-break-rofl:latest
    platform: linux/amd64
    environment:
      - BTC_POOL_URL=${BTC_POOL_URL:-}
      - BTC_WORKER=${BTC_WORKER:-}
      - BTC_PASSWORD=${BTC_PASSWORD:-x}
      - BTC_ALGO=${BTC_ALGO:-sha256d}
      - BTC_THREADS=${BTC_THREADS:-1}
